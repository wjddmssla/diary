<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문자 발송 스케줄러</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
        * { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
        .completed-item {
            text-decoration: line-through;
            opacity: 0.45;
            filter: grayscale(40%);
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- Top Navigation Bar -->
    <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
            <div class="flex items-center gap-3.5">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 text-white flex items-center justify-center shadow-lg shadow-indigo-200/50 font-bold text-lg">
                    📅
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-900 tracking-tight">개강 및 문자 발송 스케줄러</h1>
                    <p class="text-xs text-slate-400 font-medium">기수별 문자 발송 일정을 스마트하게 관리하세요</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2.5">
                <button onclick="openCategoryModal()" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200/70 text-slate-700 text-xs font-semibold rounded-xl transition active:scale-95 flex items-center gap-1.5">
                    ⚙️ 분류 설정
                </button>
                <button onclick="openModal()" class="px-4 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-xl shadow-md shadow-indigo-200 transition active:scale-95 flex items-center gap-1.5">
                    ✨ 일정 추가
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-6 py-8 flex-1 w-full space-y-8">
        
        <!-- Filter Stat Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-5">
            <!-- All -->
            <div onclick="setFilter('all')" id="card-all" class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm cursor-pointer hover:border-indigo-500 hover:shadow-md transition-all group relative overflow-hidden">
                <div class="flex justify-between items-center relative z-10">
                    <div>
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">전체 일정</span>
                        <h3 id="stat-total" class="text-2xl font-black text-slate-900 mt-0.5">0건</h3>
                    </div>
                    <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl group-hover:scale-110 transition-transform">
                        📋
                    </div>
                </div>
            </div>

            <!-- Completed -->
            <div onclick="setFilter('completed')" id="card-completed" class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm cursor-pointer hover:border-emerald-500 hover:shadow-md transition-all group relative overflow-hidden">
                <div class="flex justify-between items-center relative z-10">
                    <div>
                        <span class="text-xs font-semibold text-emerald-600/80 uppercase tracking-wider">발송 완료</span>
                        <h3 id="stat-completed" class="text-2xl font-black text-emerald-600 mt-0.5">0건</h3>
                    </div>
                    <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 flex items-center justify-center text-xl group-hover:scale-110 transition-transform">
                        ✅
                    </div>
                </div>
            </div>

            <!-- Pending -->
            <div onclick="setFilter('pending')" id="card-pending" class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-sm cursor-pointer hover:border-amber-500 hover:shadow-md transition-all group relative overflow-hidden">
                <div class="flex justify-between items-center relative z-10">
                    <div>
                        <span class="text-xs font-semibold text-amber-600/80 uppercase tracking-wider">발송 대기</span>
                        <h3 id="stat-pending" class="text-2xl font-black text-amber-500 mt-0.5">0건</h3>
                    </div>
                    <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-500 flex items-center justify-center text-xl group-hover:scale-110 transition-transform">
                        ⏳
                    </div>
                </div>
            </div>
        </div>

        <!-- Calendar Section -->
        <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm overflow-hidden">
            <!-- Calendar Header -->
            <div class="p-6 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <button onclick="changeMonth(-1)" class="w-9 h-9 border border-slate-200 rounded-xl hover:bg-slate-50 flex items-center justify-center text-slate-600 font-bold transition">‹</button>
                    <h2 id="calendar-title" class="text-lg font-bold text-slate-800 tracking-tight">2026년 10월</h2>
                    <button onclick="changeMonth(1)" class="w-9 h-9 border border-slate-200 rounded-xl hover:bg-slate-50 flex items-center justify-center text-slate-600 font-bold transition">›</button>
                </div>
                
                <div id="active-filter-badge" class="hidden items-center gap-2 bg-indigo-50 border border-indigo-100 text-indigo-700 px-3.5 py-1.5 rounded-full text-xs font-semibold">
                    <span id="filter-badge-text">필터 적용 중</span>
                    <button onclick="setFilter('all')" class="hover:bg-indigo-200/60 rounded-full w-4 h-4 inline-flex items-center justify-center">✕</button>
                </div>
            </div>

            <!-- Days Grid Header -->
            <div class="grid grid-cols-7 bg-slate-50/50 text-center font-bold text-slate-400 text-xs border-b border-slate-100">
                <div class="py-3 text-rose-500">일</div>
                <div class="py-3">월</div>
                <div class="py-3">화</div>
                <div class="py-3">수</div>
                <div class="py-3">목</div>
                <div class="py-3">금</div>
                <div class="py-3 text-sky-500">토</div>
            </div>

            <!-- Calendar Cells -->
            <div id="calendar-grid" class="grid grid-cols-7 auto-rows-fr bg-slate-100 gap-px">
                <!-- Dynamically Rendered -->
            </div>
        </div>

        <!-- Schedule List Table Section -->
        <div class="bg-white rounded-3xl border border-slate-200/80 shadow-sm p-6">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h3 class="text-base font-bold text-slate-900">전체 일정 목록 및 관리</h3>
                    <p class="text-xs text-slate-400 mt-0.5">상태 클릭으로 바로 변경하거나 [수정] 버튼으로 내용을 편집할 수 있습니다.</p>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-slate-100 text-slate-400 text-xs font-bold tracking-wider uppercase">
                            <th class="py-3.5 px-4">날짜</th>
                            <th class="py-3.5 px-4">분류</th>
                            <th class="py-3.5 px-4">문자 내용</th>
                            <th class="py-3.5 px-4 text-center">발송 상태</th>
                            <th class="py-3.5 px-4 text-center">관리</th>
                        </tr>
                    </thead>
                    <tbody id="schedule-table-body" class="divide-y divide-slate-100 text-sm">
                        <!-- Dynamically Rendered -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Schedule Add/Edit Modal -->
    <div id="schedule-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex justify-center items-center z-50 p-4 transition-all">
        <div class="bg-white rounded-3xl w-full max-w-md p-7 shadow-2xl border border-slate-100">
            <h3 id="modal-title" class="text-xl font-bold mb-5 text-slate-900">일정 추가</h3>
            <form id="schedule-form" onsubmit="handleFormSubmit(event)">
                <input type="hidden" id="edit-index" value="">
                
                <!-- Date -->
                <div class="mb-4">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">날짜</label>
                    <input type="date" id="schedule-date" required class="w-full bg-slate-50 border border-slate-200/80 rounded-2xl px-4 py-3 text-sm focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition">
                </div>

                <!-- Category -->
                <div class="mb-4">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">분류 선택</label>
                    <select id="schedule-type" class="w-full bg-slate-50 border border-slate-200/80 rounded-2xl px-4 py-3 text-sm focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition">
                        <!-- Options Rendered Dynamically -->
                    </select>
                </div>

                <!-- Content -->
                <div class="mb-4">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">문자 내용</label>
                    <input type="text" id="schedule-content" placeholder="예: 2-3기수 2주차 시작" required class="w-full bg-slate-50 border border-slate-200/80 rounded-2xl px-4 py-3 text-sm focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 outline-none transition">
                </div>

                <!-- Send Status Option (NEW) -->
                <div class="mb-6">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">발송 상태</label>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="schedule-status" value="pending" id="status-pending" class="peer hidden" checked>
                            <div class="p-3 text-center border border-slate-200 rounded-2xl text-xs font-bold text-slate-500 peer-checked:bg-amber-50 peer-checked:border-amber-300 peer-checked:text-amber-600 transition">
                                ⏳ 발송 대기
                            </div>
                        </label>
                        <label class="cursor-pointer">
                            <input type="radio" name="schedule-status" value="completed" id="status-completed" class="peer hidden">
                            <div class="p-3 text-center border border-slate-200 rounded-2xl text-xs font-bold text-slate-500 peer-checked:bg-emerald-50 peer-checked:border-emerald-300 peer-checked:text-emerald-600 transition">
                                ✅ 발송 완료
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Buttons -->
                <div class="flex gap-3">
                    <button type="button" onclick="closeModal()" class="flex-1 py-3 border border-slate-200 rounded-2xl text-slate-600 text-xs font-bold hover:bg-slate-50 transition">취소</button>
                    <button type="submit" class="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl text-xs font-bold shadow-lg shadow-indigo-200 transition">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Category Management Modal -->
    <div id="category-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex justify-center items-center z-50 p-4">
        <div class="bg-white rounded-3xl w-full max-w-md p-7 shadow-2xl border border-slate-100">
            <h3 class="text-xl font-bold mb-1 text-slate-900">문자 분류 설정</h3>
            <p class="text-xs text-slate-400 mb-5">자주 사용하는 문자 유형을 추가하거나 삭제할 수 있습니다.</p>
            
            <div class="flex gap-2 mb-5">
                <input type="text" id="new-category-input" placeholder="새 분류명 (예: 보강안내)" class="flex-1 bg-slate-50 border border-slate-200/80 rounded-2xl px-4 py-2.5 text-sm outline-none focus:bg-white focus:border-indigo-500">
                <button type="button" onclick="addCategory()" class="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-2xl text-xs font-bold transition">추가</button>
            </div>

            <div id="category-list" class="space-y-2 max-h-52 overflow-y-auto mb-6 pr-1">
                <!-- Dynamically Rendered -->
            </div>

            <button type="button" onclick="closeCategoryModal()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl text-xs font-bold transition">완료</button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        let categories = ['개강', '강의시작', '강의독려', '과제', '시험', '토론', '복습시험', '강의마감', '교강사출석'];
        
        let schedules = [
            // { id: 1, date: '2026-10-07', type: '개강', content: '2-2기수 개강 문자', completed: true },
            // { id: 2, date: '2026-10-07', type: '강의시작', content: '2-3기수 강의시작', completed: true },
            // { id: 3, date: '2026-10-07', type: '과제', content: '2-4기수 과제 안내', completed: false },
            // { id: 4, date: '2026-10-08', type: '강의독려', content: '2-3기수 강의독려', completed: false },
            // { id: 5, date: '2026-10-08', type: '시험', content: '2-10기수 시험 안내', completed: false },
            // { id: 6, date: '2026-10-14', type: '개강', content: '2-11기수 개강 문자', completed: false },
            // { id: 7, date: '2026-10-16', type: '강의마감', content: '2-3기수 강의마감', completed: false },
            // { id: 8, date: '2026-10-22', type: '복습시험', content: '2-7기수 복습시험 안내', completed: false }
        ];

        let currentYear = 2026;
        let currentMonth = 9; // 10월
        let currentFilter = 'all';

        function init() {
            renderCalendar();
            renderTable();
            updateStats();
            updateCategorySelect();
        }

        function changeMonth(dir) {
            currentMonth += dir;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            const badge = document.getElementById('active-filter-badge');
            const badgeText = document.getElementById('filter-badge-text');

            if (filterType === 'all') {
                badge.classList.add('hidden');
                badge.classList.remove('flex');
            } else {
                badge.classList.remove('hidden');
                badge.classList.add('flex');
                badgeText.innerText = filterType === 'completed' ? '발송 완료 필터 적용 중' : '발송 대기 필터 적용 중';
            }
            renderTable();
            renderCalendar();
        }

        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            grid.innerHTML = '';
            document.getElementById('calendar-title').innerText = `${currentYear}년 ${currentMonth + 1}월`;

            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            const lastDay = new Date(currentYear, currentMonth + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                const empty = document.createElement('div');
                empty.className = 'bg-slate-50/50 min-h-[120px] p-2 opacity-30';
                grid.appendChild(empty);
            }

            for (let day = 1; day <= lastDay; day++) {
                const dateStr = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const cell = document.createElement('div');
                cell.className = 'bg-white min-h-[120px] p-2 flex flex-col justify-between hover:bg-slate-50/50 transition';

                const dayHeader = document.createElement('div');
                dayHeader.className = 'text-xs font-bold text-slate-400 mb-1';
                dayHeader.innerText = `${day}일`;
                cell.appendChild(dayHeader);

                const daySchedules = schedules.filter(s => s.date === dateStr);
                const list = document.createElement('div');
                list.className = 'space-y-1.5 overflow-y-auto flex-1';

                daySchedules.forEach(item => {
                    if (currentFilter === 'completed' && !item.completed) return;
                    if (currentFilter === 'pending' && item.completed) return;

                    const badge = document.createElement('div');
                    let color = 'bg-indigo-50 text-indigo-600 border-indigo-100';
                    if (item.type === '개강') color = 'bg-rose-50 text-rose-600 border-rose-100';
                    if (item.type.includes('마감')) color = 'bg-amber-50 text-amber-600 border-amber-100';

                    badge.className = `text-[11px] px-2 py-1 rounded-xl font-semibold border cursor-pointer truncate transition hover:scale-[0.98] ${color} ${item.completed ? 'completed-item' : ''}`;
                    badge.innerText = `${item.completed ? '✅' : '⏳'} [${item.type}] ${item.content}`;
                    badge.onclick = (e) => {
                        e.stopPropagation();
                        toggleComplete(item.id);
                    };
                    list.appendChild(badge);
                });

                cell.appendChild(list);
                grid.appendChild(cell);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('schedule-table-body');
            tbody.innerHTML = '';

            let filtered = [...schedules];
            if (currentFilter === 'completed') filtered = filtered.filter(s => s.completed);
            if (currentFilter === 'pending') filtered = filtered.filter(s => !s.completed);

            filtered.sort((a, b) => new Date(a.date) - new Date(b.date));

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-12 text-slate-400 text-xs font-medium">등록되거나 조건에 부합하는 일정이 없습니다.</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = `hover:bg-slate-50/80 transition ${item.completed ? 'bg-slate-50/40' : ''}`;
                tr.innerHTML = `
                    <td class="py-4 px-4 font-semibold text-slate-700 text-xs">${item.date}</td>
                    <td class="py-4 px-4"><span class="px-2.5 py-1 text-[11px] rounded-lg bg-slate-100 text-slate-600 font-bold">${item.type}</span></td>
                    <td class="py-4 px-4 font-medium ${item.completed ? 'line-through text-slate-300' : 'text-slate-800'}">${item.content}</td>
                    <td class="py-4 px-4 text-center">
                        <button onclick="toggleComplete(${item.id})" class="px-3 py-1.5 text-xs rounded-xl font-bold transition active:scale-95 ${item.completed ? 'bg-emerald-50 text-emerald-600 hover:bg-emerald-100' : 'bg-amber-50 text-amber-600 hover:bg-amber-100'}">
                            ${item.completed ? '발송 완료 ✅' : '발송 대기 ⏳'}
                        </button>
                    </td>
                    <td class="py-4 px-4 text-center space-x-2">
                        <button onclick="openEditModal(${item.id})" class="text-indigo-600 hover:text-indigo-800 text-xs font-bold">수정</button>
                        <button onclick="deleteSchedule(${item.id})" class="text-rose-500 hover:text-rose-700 text-xs font-bold">삭제</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function updateStats() {
            document.getElementById('stat-total').innerText = `${schedules.length}건`;
            document.getElementById('stat-completed').innerText = `${schedules.filter(s => s.completed).length}건`;
            document.getElementById('stat-pending').innerText = `${schedules.filter(s => !s.completed).length}건`;
        }

        function toggleComplete(id) {
            const item = schedules.find(s => s.id === id);
            if (item) {
                item.completed = !item.completed;
                renderCalendar();
                renderTable();
                updateStats();
            }
        }

        function updateCategorySelect() {
            const select = document.getElementById('schedule-type');
            select.innerHTML = '';
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                select.appendChild(opt);
            });
        }

        function openModal() {
            document.getElementById('modal-title').innerText = '새 일정 등록';
            document.getElementById('edit-index').value = '';
            document.getElementById('schedule-date').value = '';
            document.getElementById('schedule-content').value = '';
            document.getElementById('status-pending').checked = true; // 기본값: 발송대기
            document.getElementById('schedule-modal').classList.remove('hidden');
        }

        function openEditModal(id) {
            const item = schedules.find(s => s.id === id);
            if (item) {
                document.getElementById('modal-title').innerText = '일정 수정';
                document.getElementById('edit-index').value = item.id;
                document.getElementById('schedule-date').value = item.date;
                document.getElementById('schedule-type').value = item.type;
                document.getElementById('schedule-content').value = item.content;
                
                // 발송 상태 반영
                if (item.completed) {
                    document.getElementById('status-completed').checked = true;
                } else {
                    document.getElementById('status-pending').checked = true;
                }

                document.getElementById('schedule-modal').classList.remove('hidden');
            }
        }

        function closeModal() {
            document.getElementById('schedule-modal').classList.add('hidden');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-index').value;
            const date = document.getElementById('schedule-date').value;
            const type = document.getElementById('schedule-type').value;
            const content = document.getElementById('schedule-content').value;
            const isCompleted = document.getElementById('status-completed').checked;

            if (editId) {
                const item = schedules.find(s => s.id == editId);
                if (item) { 
                    item.date = date; 
                    item.type = type; 
                    item.content = content; 
                    item.completed = isCompleted;
                }
            } else {
                const newId = schedules.length > 0 ? Math.max(...schedules.map(s => s.id)) + 1 : 1;
                schedules.push({ id: newId, date, type, content, completed: isCompleted });
            }

            closeModal();
            renderCalendar();
            renderTable();
            updateStats();
        }

        function deleteSchedule(id) {
            if (confirm('정말 삭제하시겠습니까?')) {
                schedules = schedules.filter(s => s.id !== id);
                renderCalendar();
                renderTable();
                updateStats();
            }
        }

        function openCategoryModal() {
            renderCategoryList();
            document.getElementById('category-modal').classList.remove('hidden');
        }

        function closeCategoryModal() {
            document.getElementById('category-modal').classList.add('hidden');
            updateCategorySelect();
            renderCalendar();
            renderTable();
        }

        function renderCategoryList() {
            const listContainer = document.getElementById('category-list');
            listContainer.innerHTML = '';
            categories.forEach((cat, index) => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-slate-50 px-4 py-2.5 rounded-2xl border border-slate-100 text-xs font-semibold text-slate-700';
                div.innerHTML = `
                    <span>${cat}</span>
                    <button onclick="deleteCategory(${index})" class="text-rose-500 hover:text-rose-700">삭제</button>
                `;
                listContainer.appendChild(div);
            });
        }

        function addCategory() {
            const input = document.getElementById('new-category-input');
            const val = input.value.trim();
            if (val && !categories.includes(val)) {
                categories.push(val);
                input.value = '';
                renderCategoryList();
            }
        }

        function deleteCategory(index) {
            if (categories.length <= 1) {
                alert('최소 1개의 분류는 유지되어야 합니다.');
                return;
            }
            categories.splice(index, 1);
            renderCategoryList();
        }

        init();
    </script>
</body>
</html>
