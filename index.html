<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문자 발송 스케줄러</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <!-- SheetJS (Excel Read Library) -->

    <style>
        * { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }

</head>
<body class="bg-[#F8FAFC] text-slate-800 min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white">

    <!-- Top Navigation Bar -->

        <div class="max-w-7xl mx-auto px-4 sm:px-6 h-auto sm:h-20 py-3 sm:py-0 flex flex-col sm:flex-row justify-between items-center gap-3">

                        📅

    <!-- Schedule Single Add/Edit Modal -->

            <form id="schedule-form" onsubmit="handleFormSubmit(event)">

                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1.5 sm:mb-2">발송 대상</label>
                        <select id="schedule-target" class="w-full bg-slate-50 border border-slate-200/80 rounded-2xl px-3 sm:px-4 py-3 text-xs sm:text-sm focus:bg-white focus:border-indigo-500 outline-none transition font-bold text-indigo-600">

                    <input type="text" id="schedule-content" placeholder="예: 안내 문자 발송" required class="w-full bg-slate-50 border border-slate-200/80 rounded-2xl px-4 py-3 text-sm focus:bg-white focus:border-indigo-500 outline-none transition">

    <div id="batch-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex justify-center items-center z-50 p-4">
        <div class="bg-white rounded-3xl w-full max-w-4xl p-5 sm:p-7 shadow-2xl border border-slate-100 flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h3 class="text-base sm:text-lg font-bold text-slate-900">📊 수동 표 일괄 등록</h3>
                    <p class="text-[11px] sm:text-xs text-slate-400 mt-0.5">행을 추가하며 기간 및 일정을 작성하세요.</p>
                </div>
                <button onclick="addBatchRow()" class="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 text-xs font-bold rounded-xl transition">

            <div class="overflow-y-auto flex-1 mb-4 sm:mb-5 pr-1 border border-slate-200/80 rounded-2xl">
                <table class="w-full text-left border-collapse min-w-[650px] sm:min-w-full">
                    <thead class="sticky top-0 bg-slate-50 border-b border-slate-200 text-xs font-bold text-slate-500">
                        <tr>
                            <th class="p-2.5 sm:p-3 w-32">시작일</th>

                            <th class="p-2.5 sm:p-3 w-28">분류</th>

    <!-- Category Management Modal -->
    <div id="category-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden flex justify-center items-center z-50 p-4">
        <div class="bg-white rounded-3xl w-full max-w-md p-6 sm:p-7 shadow-2xl border border-slate-100">
            <h3 class="text-lg sm:text-xl font-bold mb-1 text-slate-900">문자 분류 설정</h3>
            <p class="text-xs text-slate-400 mb-4 sm:mb-5">자주 사용하는 문자 유형을 추가하거나 삭제할 수 있습니다.</p>
            
            <div class="flex gap-2 mb-4 sm:mb-5">
                <input type="text" id="new-category-input" placeholder="새 분류명 (예: 보강안내)" class="flex-1 bg-slate-50 border border-slate-200/80 rounded-2xl px-4 py-2.5 text-xs sm:text-sm outline-none focus:bg-white focus:border-indigo-500">
                <button type="button" onclick="addCategory()" class="px-4 py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-2xl text-xs font-bold transition">추가</button>
            </div>

            <div id="category-list" class="space-y-2 max-h-52 overflow-y-auto mb-5 sm:mb-6 pr-1">
                <!-- Dynamically Rendered -->
            </div>

            <button type="button" onclick="closeCategoryModal()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl text-xs font-bold transition">완료</button>
        </div>
    </div>

    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <!-- App JavaScript Logic -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyA9QCqpFLatO-mFZZ3NMSngz_hq52Wbi54",
            authDomain: "diary-site-70311.firebaseapp.com",
            databaseURL: "https://diary-site-70311-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "diary-site-70311",
            storageBucket: "diary-site-70311.firebasestorage.app",
            messagingSenderId: "425971233123",
            appId: "1:425971233123:web:5916cd81d72ff01b432356",
            measurementId: "G-WRRSESHYY5"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let categories = ['학습기간', '수강일정', '토론/복습시험', '중간고사', '기말고사', '과제', '개강', '강의시작', '강의독려'];
        let schedules = {}; // 안전한 객체 저장 구조

        let currentYear = new Date().getFullYear();
        let currentMonth = new Date().getMonth();
        let currentFilter = 'all';

        // 즉시 화면 렌더링
        renderCalendar();
        renderTable();
        updateStats();
        updateCategorySelect();

        // Firebase 실시간 동기화
        // ==========================================
// FIREBASE 실시간 데이터베이스 연결
// ==========================================

const schedulerRef = db.ref('scheduler_clean_data');

// Firebase 연결 및 데이터 읽기
schedulerRef.on(
    'value',
    (snapshot) => {
        const data = snapshot.val();

        if (data) {
            categories = Array.isArray(data.categories)
                ? data.categories
                : categories;

            schedules = data.schedules || {};
        } else {
            schedules = {};
        }

        renderCalendar();
        renderTable();
        updateStats();
        updateCategorySelect();

        console.log('Firebase 데이터 불러오기 성공!');
    },
    (error) => {
        console.error('Firebase 읽기 오류:', error);
        alert(
            'Firebase 데이터 읽기에 실패했습니다.\n' +
            error.message
        );
    }
);

// Firebase 데이터 저장
async function saveData() {
    try {
        await schedulerRef.set({
            categories: categories,
            schedules: schedules
        });

        console.log('Firebase 저장 성공!');

        renderCalendar();
        renderTable();
        updateStats();
        updateCategorySelect();

        return true;

    } catch (error) {
        console.error('Firebase 저장 실패:', error);

        alert(
            '데이터 저장에 실패했습니다.\n\n' +
            error.message
        );

        return false;
    }
}

        function updateCategorySelect() {
            const select = document.getElementById('schedule-type');
            if(!select) return;
            select.innerHTML = '';
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.innerText = cat;
                select.appendChild(opt);
            });
        }

        function openModal() {
            document.getElementById('modal-title').innerText = '새 일정 등록';
            document.getElementById('edit-id').value = '';
            document.getElementById('schedule-date').value = '';
            document.getElementById('schedule-end-date').value = '';
            document.getElementById('schedule-content').value = '';
            document.getElementById('schedule-target').value = '전체';
            document.getElementById('status-pending').checked = true;
            document.getElementById('schedule-modal').classList.remove('hidden');
        }

        function openEditModal(id) {
            const item = schedules[id];
            if (item) {
                document.getElementById('modal-title').innerText = '일정 수정';
                document.getElementById('edit-id').value = item.id;
                document.getElementById('schedule-date').value = item.date;
                document.getElementById('schedule-end-date').value = item.endDate || '';
                document.getElementById('schedule-type').value = item.type;
                document.getElementById('schedule-target').value = item.target || '전체';
                document.getElementById('schedule-content').value = item.content;
                
                if (item.completed) {
                    document.getElementById('status-completed').checked = true;
                } else {
                    document.getElementById('status-pending').checked = true;
                }

                document.getElementById('schedule-modal').classList.remove('hidden');
            }
        }

        function closeModal() {
            document.getElementById('schedule-modal').classList.add('hidden');
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-id').value;
            const date = document.getElementById('schedule-date').value;
            const endDate = document.getElementById('schedule-end-date').value;
            const type = document.getElementById('schedule-type').value;
            const target = document.getElementById('schedule-target').value;
            const content = document.getElementById('schedule-content').value;
            const isCompleted = document.getElementById('status-completed').checked;

            const id = editId ? editId : 'sched_' + Date.now();

            schedules[id] = {
                id: id,
                date: date,
                endDate: endDate ? endDate : date, // 종료일 없으면 시작일과 동일
                type: type,
                target: target,
                content: content,
                completed: isCompleted
            };

            saveData();
            closeModal();
        }

        function deleteSchedule(id) {
            if (confirm('정말 삭제하시겠습니까?')) {
                delete schedules[id];
                saveData();
            }
        }

        /* --- 📂 엑셀 업로드 (사용자가 설정한 날짜/기간 그대로 반영) --- */
        function handleExcelUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                    if (jsonRows.length < 2) {
                        alert('엑셀 파일에 유효한 데이터가 없습니다.');
                        return;
                    }

                    const header = jsonRows[0].map(h => String(h).trim());
                    let dateIdx = -1, endDateIdx = -1, typeIdx = -1, targetIdx = -1, contentIdx = -1;

                    header.forEach((h, idx) => {
                        if (h.includes('시작') || h.includes('날짜') || h.includes('일자')) dateIdx = idx;
                        else if (h.includes('종료')) endDateIdx = idx;
                        else if (h.includes('분류') || h.includes('유형')) typeIdx = idx;
                        else if (h.includes('대상')) targetIdx = idx;
                        else if (h.includes('내용') || h.includes('일정') || h.includes('문자')) contentIdx = idx;
                    });

                    if (dateIdx === -1) dateIdx = 0;
                    if (contentIdx === -1) contentIdx = header.length - 1;

                    let addedCount = 0;

                    for (let i = 1; i < jsonRows.length; i++) {
                        const row = jsonRows[i];
                        if (!row || row.length === 0) continue;

                        let dateVal = row[dateIdx] ? String(row[dateIdx]).trim() : '';
                        let endDateVal = endDateIdx !== -1 && row[endDateIdx] ? String(row[endDateIdx]).trim() : '';
                        let typeVal = typeIdx !== -1 && row[typeIdx] ? String(row[typeIdx]).trim() : '수강일정';
                        let targetVal = targetIdx !== -1 && row[targetIdx] ? String(row[targetIdx]).trim() : '전체';
                        let contentVal = contentIdx !== -1 && row[contentIdx] ? String(row[contentIdx]).trim() : '';

                        if (!isNaN(dateVal) && dateVal !== '') {
                            const d = XLSX.SSF.parse_date_code(Number(dateVal));
                            if (d) dateVal = `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
                        }
                        if (!isNaN(endDateVal) && endDateVal !== '') {
                            const d = XLSX.SSF.parse_date_code(Number(endDateVal));
                            if (d) endDateVal = `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
                        }

                        if (dateVal && contentVal) {
                            const id = 'sched_excel_' + Date.now() + '_' + i;
                            schedules[id] = {
                                id: id,
                                date: dateVal,
                                endDate: endDateVal ? endDateVal : dateVal,
                                type: categories.includes(typeVal) ? typeVal : '수강일정',
                                target: targetVal.includes('미참') ? '미참여자' : '전체',
                                content: contentVal,
                                completed: false
                            };
                            addedCount++;
                        }
                    }

                    if (addedCount > 0) {
                        saveData();
                        alert(`엑셀에서 ${addedCount}건의 일정을 성공적으로 불러왔습니다!`);
                    } else {
                        alert('올바른 데이터를 찾지 못했습니다.');
                    }
                } catch (err) {
                    console.error(err);
                    alert('엑셀 파일 읽기 오류');
                }
                event.target.value = '';
            };
            reader.readAsArrayBuffer(file);
        }

        /* --- 📊 수동 표 일괄 등록 --- */
        function openBatchModal() {
            const tbody = document.getElementById('batch-table-body');
            if(!tbody) return;
            tbody.innerHTML = '';
            for(let i = 0; i < 3; i++) {
                addBatchRow();
            }
            document.getElementById('batch-modal').classList.remove('hidden');
        }

        function closeBatchModal() {
            document.getElementById('batch-modal').classList.add('hidden');
        }

        function addBatchRow() {
            const tbody = document.getElementById('batch-table-body');
            if(!tbody) return;
            const tr = document.createElement('tr');
            
            let categoryOptions = categories.map(c => `<option value="${c}">${c}</option>`).join('');

            tr.innerHTML = `
                <td class="p-2"><input type="date" class="batch-date w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 outline-none focus:bg-white focus:border-indigo-500"></td>
                <td class="p-2"><input type="date" class="batch-end-date w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 outline-none focus:bg-white focus:border-indigo-500"></td>
                <td class="p-2">
                    <select class="batch-type w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 outline-none focus:bg-white focus:border-indigo-500">
                        ${categoryOptions}
                    </select>
                </td>
                <td class="p-2">
                    <select class="batch-target w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 outline-none focus:bg-white focus:border-indigo-500 font-bold text-indigo-600">
                        <option value="전체">📢 전체</option>
                        <option value="미참여자">🎯 미참여자</option>
                    </select>
                </td>
                <td class="p-2"><input type="text" placeholder="문자 내용" class="batch-content w-full bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5 outline-none focus:bg-white focus:border-indigo-500"></td>
                <td class="p-2 text-center">
                    <button type="button" onclick="this.closest('tr').remove()" class="text-rose-500 hover:text-rose-700 font-bold">✕</button>
                </td>
            `;
            tbody.appendChild(tr);
        }

        function saveBatchSchedules() {
            const rows = document.querySelectorAll('#batch-table-body tr');
            let addedCount = 0;

            rows.forEach((row, idx) => {
                const date = row.querySelector('.batch-date').value;
                const endDate = row.querySelector('.batch-end-date').value;
                const type = row.querySelector('.batch-type').value;
                const target = row.querySelector('.batch-target').value;
                const content = row.querySelector('.batch-content').value.trim();

                if (date && content) {
                    const id = 'sched_manual_' + Date.now() + '_' + idx;
                    schedules[id] = {
                        id: id,
                        date: date,
                        endDate: endDate ? endDate : date,
                        type: type,
                        target: target,
                        content: content,
                        completed: false
                    };
                    addedCount++;
                }
            });

            if (addedCount === 0) {
                alert('날짜와 내용이 작성된 행이 최소 1개 이상 있어야 합니다.');
                return;
            }

            saveData();
            closeBatchModal();
        }

        /* --- 분류 관리 --- */
        function openCategoryModal() {
            renderCategoryList();
            document.getElementById('category-modal').classList.remove('hidden');
        }

        function closeCategoryModal() {
            document.getElementById('category-modal').classList.add('hidden');
            updateCategorySelect();
        }

        function renderCategoryList() {
            const listContainer = document.getElementById('category-list');
            if(!listContainer) return;
            listContainer.innerHTML = '';
            categories.forEach((cat, index) => {
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center bg-slate-50 px-4 py-2.5 rounded-2xl border border-slate-100 text-xs font-semibold text-slate-700';
                div.innerHTML = `
                    <span>${cat}</span>
                    <button onclick="deleteCategory(${index})" class="text-rose-500 hover:text-rose-700">삭제</button>
                `;
                listContainer.appendChild(div);
            });
        }

        function addCategory() {
            const input = document.getElementById('new-category-input');
            const val = input.value.trim();
            if (val && !categories.includes(val)) {
                categories.push(val);
                input.value = '';
                saveData();
                renderCategoryList();
            }
        }

        function deleteCategory(index) {
            if (categories.length <= 1) {
                alert('최소 1개의 분류는 유지되어야 합니다.');
                return;
            }
            categories.splice(index, 1);
            saveData();
            renderCategoryList();
        }
    </script>
</body>
